<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: #101418; color: #e8eaed;
      padding: 1.5rem;
    }
    main {
      width: 100%; max-width: 30rem;
      text-align: center;
    }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 1.25rem;
      border-radius: 16px;
      background: #1c2530;
      display: grid; place-items: center;
      font-size: 30px; line-height: 1;
    }
    h1 { font-weight: 600; font-size: 1.6rem; margin: 0 0 .5rem; }
    p  { margin: 0 0 1rem; color: #aab2bd; line-height: 1.5; }
    .card {
      background: #161b22; border: 1px solid #232b36;
      border-radius: 14px; padding: 1.5rem; margin-top: 1rem;
      text-align: left;
    }
    .card h2 { font-size: .95rem; margin: 0 0 .6rem; font-weight: 600; }
    .card p  { font-size: .9rem; margin: 0; }
    footer { margin-top: 1.5rem; font-size: .8rem; color: #6b7480; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">📶</div>
    <h1>Welcome</h1>
    <p>You are connected to the local network.</p>

    <div class="card">
      <h2>About this network</h2>
      <p>This is a walled garden — there is no internet access here. Everything
         you can reach lives on this device.</p>
    </div>

    <p style="margin-top:1.25rem">
      <a href="/guestbook"
         style="color:#7cc4ff;font-weight:600;text-decoration:none">
        ✍️ Sign the guestbook &rarr;
      </a>
    </p>

    <footer>Portal</footer>
  </main>
</body>
</html>
